<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D8391F">
<title>Forno Vivo — Peça sua pizza online</title>
<meta name="description" content="Monte sua pizza, acompanhe o desenho mudar ao vivo e pague com Pix sem sair do site.">

<!-- Fonte: títulos em Bricolage Grotesque, texto em DM Sans (Google Fonts) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">

<!-- Todo o estilo do site vive em css/style.css (ver comentários lá dentro) -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!--
  Esta <svg> invisível (width/height 0) só existe para guardar as
  definições reutilizáveis (<defs>) usadas pelo desenho da pizza:
  gradientes (cor do queijo, da massa, do molho...) e filtros (textura
  da madeira, derretimento do queijo, sombra dos ingredientes...).
  Precisa ficar no HTML (não dá para mover para um arquivo externo),
  porque os elementos do desenho referenciam essas definições por
  id, com url(#id-do-gradiente-ou-filtro). Quem gera o restante do
  desenho é js/draw.js.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>

<linearGradient id="g-wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C99C64"/><stop offset=".5" stop-color="#B2854F"/><stop offset="1" stop-color="#8F653A"/></linearGradient>
<radialGradient id="g-sauce" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#C63D24"/><stop offset="1" stop-color="#8E2313"/></radialGradient>
<radialGradient id="g-cheese" cx=".42" cy=".38" r=".65"><stop offset="0" stop-color="#F8E29A"/><stop offset=".6" stop-color="#F1C963"/><stop offset="1" stop-color="#DDA240"/></radialGradient>
<radialGradient id="g-bubble" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFF0B8"/><stop offset="1" stop-color="#EBBB57"/></radialGradient>
<radialGradient id="g-light" cx=".33" cy=".28" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#1a0800" stop-opacity=".3"/></radialGradient>
<radialGradient id="g-tomato" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#F26A50"/><stop offset="1" stop-color="#D02E1A"/></radialGradient>
<radialGradient id="g-cal" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#C6402F"/><stop offset=".7" stop-color="#9A2018"/><stop offset="1" stop-color="#6E140E"/></radialGradient>
<radialGradient id="g-olive" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#4c4c4c"/><stop offset="1" stop-color="#151515"/></radialGradient>
<linearGradient id="g-mush" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3E8D4"/><stop offset="1" stop-color="#CDB48D"/></linearGradient>
<radialGradient id="g-broc" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#55B658"/><stop offset="1" stop-color="#216B2B"/></radialGradient>
<linearGradient id="g-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#82CE66"/><stop offset="1" stop-color="#2E7E34"/></linearGradient>
<radialGradient id="g-basil" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#44B04E"/><stop offset="1" stop-color="#17602A"/></radialGradient>
<radialGradient id="g-corn" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFE467"/><stop offset="1" stop-color="#E0A80A"/></radialGradient>
<radialGradient id="g-heart" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FFF6D9"/><stop offset="1" stop-color="#E9CF96"/></radialGradient>
<radialGradient id="g-white" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0E9D9"/></radialGradient>
<radialGradient id="g-yolk" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#FFD65A"/><stop offset="1" stop-color="#F08A00"/></radialGradient>
<linearGradient id="g-ham" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8BDB6"/><stop offset="1" stop-color="#E78681"/></linearGradient>
<radialGradient id="g-beef" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#8E5236"/><stop offset="1" stop-color="#4B2717"/></radialGradient>
<linearGradient id="g-prov" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF2BB"/><stop offset="1" stop-color="#F0CB5E"/></linearGradient>
<radialGradient id="g-gorg" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FCF9EE"/><stop offset="1" stop-color="#E2DDC8"/></radialGradient>
<radialGradient id="g-cream" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3EACF"/></radialGradient>
<radialGradient id="g-cheddar" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#FFC95E"/><stop offset="1" stop-color="#EF8C12"/></radialGradient>
<radialGradient id="g-choc" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#6F3D26"/><stop offset="1" stop-color="#42221A"/></radialGradient>
<radialGradient id="g-straw" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FF7386"/><stop offset="1" stop-color="#C21D39"/></radialGradient>
<filter id="f-wood" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.3" numOctaves="3" seed="4" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .32  0 0 0 0 .19  0 0 0 0 .08  0 0 0 .9 -.28" result="grain"/><feComposite in="grain" in2="SourceGraphic" operator="in" result="g2"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="g2"/></feMerge></filter>
<filter id="f-edge" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="5" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="f-crust" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="8" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="6" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation=".45"/></filter>
<filter id="f-cheese" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="12" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="B" result="d"/><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="3" result="t2"/><feColorMatrix in="t2" type="matrix" values="0 0 0 0 .74  0 0 0 0 .44  0 0 0 0 .13  0 0 0 1.5 -.62" result="brown"/><feComposite in="brown" in2="d" operator="in" result="b2"/><feMerge><feMergeNode in="d"/><feMergeNode in="b2"/></feMerge></filter>
<filter id="f-drop" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx=".8" dy="1.6" stdDeviation="1.3" flood-color="#3a1a05" flood-opacity=".5"/></filter>
<filter id="f-b1" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.1"/></filter>
<filter id="f-b3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
</defs></svg>

<!--
  Estrutura mínima da página: um cabeçalho fixo (#hdr), a área de
  conteúdo que troca de tela (#view), a barra inferior de ação (#bar)
  e um aviso temporário (#toast). Todo o conteúdo de cada tela é
  gerado dinamicamente pelo JavaScript em js/app.js — isso é o que
  permite trocar de tela sem recarregar a página (comportamento de
  "app de uma página só").
-->
<div class="app" id="app">
  <header class="top" id="hdr"></header>
  <main id="view"></main>
  <div class="bar" id="bar" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div id="fab" hidden></div>
</div>

<!--
  Ordem de carregamento dos scripts — IMPORTA, porque cada um usa o que
  o anterior definiu (nenhum é um módulo ES, todos compartilham o mesmo
  escopo global, como arquivos clássicos de <script>):
    1. catalog.js → dados da pizzaria (o arquivo que você edita por cliente)
    2. core.js    → utilitários, estado e cálculo de preços
    3. draw.js    → motor de desenho da pizza em SVG
    4. app.js     → telas, navegação e ações (inicializa o app no final)
-->
<script src="js/catalog.js"></script>
<script src="js/core.js"></script>
<script src="js/draw.js"></script>
<script src="js/app.js"></script>
</body>
</html>
